<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/logo.svg" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#542b2b" />
    <meta name="description" content="Yuvadarpan community directory and member portal." />
    <meta name="application-name" content="Yuvadarpan" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yuvadarpan" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Yuvadarpan</title>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #f4f0ea;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f0ea;
      }
      #app-splash svg {
        width: min(80vw, 400px);
        height: min(15vh, 80px);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="app-splash" role="alert" aria-busy="true" aria-label="Loading YUVADARPAN">
        <svg viewBox="0 0 400 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="splashGradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#542b2b" stop-opacity="0.2" />
              <stop offset="50%" stop-color="#a36767" stop-opacity="1" />
              <stop offset="100%" stop-color="#542b2b" stop-opacity="0.2" />
            </linearGradient>
            <mask id="splashMask">
              <text
                x="50%"
                y="50%"
                dominant-baseline="middle"
                text-anchor="middle"
                font-size="50"
                font-weight="700"
                font-family="'Work Sans', sans-serif"
                fill="white"
                letter-spacing="4"
              >YUVADARPAN</text>
            </mask>
          </defs>
          <rect width="400" height="80" fill="url(#splashGradient)" mask="url(#splashMask)">
            <animate attributeName="x" values="-400;400" dur="3.5s" repeatCount="indefinite" />
          </rect>
          <text
            x="50%"
            y="50%"
            dominant-baseline="middle"
            text-anchor="middle"
            font-size="50"
            font-weight="700"
            font-family="'Work Sans', sans-serif"
            fill="none"
            stroke="#542b2b"
            stroke-width="1.5"
            letter-spacing="4"
          >YUVADARPAN</text>
        </svg>
      </div>
    </div>
  </body>
</html>
